name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
    paths:
      - 'output/**.html'
      - 'docs/**.html'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild docs/index.html with password gate
        run: python3 scripts/inject_gate.py
        env:
          PW_HASH: ${{ secrets.PW_HASH }}
          GH_TOKEN: ${{ secrets.GH_DATA_TOKEN }}
          GH_REPO: "okjungil/yab-notice-2026"

      - name: Commit regenerated docs if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          git diff --staged --quiet || git commit -m "chore: regenerate docs/index.html"
          git push

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - uses: actions/deploy-pages@v4
        id: deployment
